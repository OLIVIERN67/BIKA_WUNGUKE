<!doctype html>
<html lang="rw">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BIKA WUNGUKE - simple cash-flow and record-keeping tool for small traders in Rwanda."
    />
    <meta name="theme-color" content="#059669" />
    <title>BIKA WUNGUKE - Bika neza. Cunga neza. Wunguke kurushaho.</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('bika_wunguke_theme') || 'system';
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
          var lang = localStorage.getItem('bika_wunguke_lang');
          if (lang === 'en' || lang === 'rw' || lang === 'fr') {
            document.documentElement.lang = lang;
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
